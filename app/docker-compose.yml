      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=guest
      - RABBITMQ_PASS=guest
      - RABBITMQ_QUEUE=warehouse_events
    depends_on:
      db_wh002:
        condition: service_healthy
    networks:
      - warehouse_net

  frontend_wh002:
    build:
      context: ./src/frontend/app
      dockerfile: Dockerfile
    container_name: frontend_wh002
    ports:
      - "8082:80"
    environment:
      - API_TARGET=api_wh002:8000
    depends_on:
      - api_wh002
    networks:
      - warehouse_net

  # ============================================================================
  # 5. BODEGA 3 (WH-003) — NODO AUTÓNOMO CON OUTBOX PATTERN
  # ============================================================================
  db_wh003:
    image: postgres:15-alpine
    container_name: db_wh003
