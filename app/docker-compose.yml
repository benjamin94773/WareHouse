services:
  # ============================================================================
  # 1. BROKER DE MENSAJERÍA (RABBITMQ)
  # ============================================================================
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: warehouse_broker
    ports:
      - "5672:5672"    # Puerto AMQP para comunicación entre máquinas
      - "15672:15672"  # Panel de administración Web (http://localhost:15672)
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - warehouse_net

  # ============================================================================
  # 2. PLATAFORMA CENTRAL Y SISTEMA DE REPORTES (CQRS READ MODEL)
  # ============================================================================
  central_platform:
    build:
      context: ./src/central
      dockerfile: Dockerfile
    container_name: warehouse_central_platform
    ports:
      - "8080:8080"
    environment:
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=guest
      - RABBITMQ_PASS=guest
      - RABBITMQ_QUEUE=warehouse_events
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - warehouse_net

  # ============================================================================
  # 3. BODEGA 1 (WH-001) — NODO AUTÓNOMO CON OUTBOX PATTERN
  # ============================================================================
  db_wh001:
    image: postgres:15-alpine
    container_name: db_wh001
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: warehouse_db
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - warehouse_net

  api_wh001:
    build:
      context: ./src/backend/app
      dockerfile: Dockerfile
    container_name: api_wh001
    ports:
      - "8001:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db_wh001:5432/warehouse_db
      - WAREHOUSE_ID=WH-001
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=guest
      - RABBITMQ_PASS=guest
      - RABBITMQ_QUEUE=warehouse_events
    depends_on:
      db_wh001:
        condition: service_healthy
    networks:
      - warehouse_net

  frontend_wh001:
    build:
      context: ./src/frontend/app
      dockerfile: Dockerfile
    container_name: frontend_wh001
    ports:
      - "8081:80"
    environment:
      - API_TARGET=api_wh001:8000
    depends_on:
      - api_wh001
    networks:
      - warehouse_net

  # ============================================================================
  # 4. BODEGA 2 (WH-002) — NODO AUTÓNOMO CON OUTBOX PATTERN
  # ============================================================================
  db_wh002:
    image: postgres:15-alpine
    container_name: db_wh002
