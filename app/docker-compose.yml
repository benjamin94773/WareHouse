      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: warehouse_db
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - warehouse_net

  api_wh002:
    build:
      context: ./src/backend/app
      dockerfile: Dockerfile
    container_name: api_wh002
    ports:
      - "8002:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db_wh002:5432/warehouse_db
      - WAREHOUSE_ID=WH-002
