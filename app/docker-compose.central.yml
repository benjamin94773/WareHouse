# Plataforma central: RabbitMQ + read model (PostgreSQL) + API central + workers.
#   docker compose -f docker-compose.central.yml up -d --build
name: central

x-central-env: &central-env
  CENTRAL_DATABASE_URL: postgresql://postgres:${CENTRAL_DB_PASSWORD:-postgres}@central_db:5432/central
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_USER: ${RABBITMQ_USER:-warehouse}
  RABBITMQ_PASS: ${RABBITMQ_PASS:-warehouse}
  WAREHOUSES: ${WAREHOUSES:-WH-001=http://host.docker.internal:8001/api,WH-002=http://host.docker.internal:8002/api,WH-003=http://host.docker.internal:8003/api}
  S3_BUCKET: ${S3_BUCKET:-}
  AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}

services:
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    hostname: rabbitmq  # el nombre del nodo define el directorio de datos persistidos
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      # "guest" solo puede conectarse desde localhost; las bodegas usan este usuario
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-warehouse}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-warehouse}
    volumes:
      - rabbitmq:/var/lib/rabbitmq  # colas y mensajes durables sobreviven al reinicio
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      retries: 10

  central_db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${CENTRAL_DB_PASSWORD:-postgres}
      POSTGRES_DB: central
    volumes:
      - central_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  central_api:
    build:
      context: ./src
      dockerfile: central/Dockerfile
    image: central:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      <<: *central-env
      SERVICE_NAME: central-api
    depends_on:
      central_db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  central_worker:
    build:  # misma imagen que la API central, otro proceso
      context: ./src
      dockerfile: central/Dockerfile
    image: central:latest
    restart: unless-stopped
    command: ["python", "worker.py"]
    environment:
      <<: *central-env
      SERVICE_NAME: central-worker
    depends_on:
      central_api:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  rabbitmq:
  central_pg:
